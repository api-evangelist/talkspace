aid: talkspace
name: Talkspace
description: >-
  Talkspace is a New York City-based online behavioral healthcare company
  founded in 2012 by Oren Frank and Roni Frank that delivers virtual therapy,
  psychiatry, and medication management through video, voice, messaging, and
  live chat. The platform connects users with licensed therapists and
  psychiatric providers across all 50 U.S. states, covering more than 150
  mental health conditions including anxiety, depression, ADHD, bipolar
  disorder, OCD, PTSD, insomnia, postpartum depression, and substance use.
  Service lines include individual therapy for adults, teen therapy
  (ages 13-17), couples therapy, psychiatry with prescription management,
  and specialized programs for LGBTQIA+, military/veteran, and senior
  populations, plus the women's mental health program Chapters. Talkspace is
  in-network with major payers such as Aetna, Anthem, Cigna, Optum, Blue
  Cross Blue Shield, TRICARE, and Medicare, and sells B2B solutions
  (Talkspace for Business) to employers, payers, benefit consultants,
  educational institutions, and government agencies. The company markets
  Precision Therapy, an internal machine-learning and NLP system used to
  match members to providers and surface clinical signal. Talkspace went
  public on NASDAQ under ticker TALK on June 23, 2021 via a SPAC merger
  with Hudson Executive Investment Corp, and was acquired by Universal
  Health Services on March 9, 2026. Talkspace does not publish a public
  developer API, SDK, or open-source repository; integrations with payers,
  EAPs, and benefits platforms are delivered through private partnership
  channels, and the platform is HIPAA, HITECH, and GDPR compliant.
